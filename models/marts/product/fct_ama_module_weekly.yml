version: 2
models:
  - name: fct_ama_module_weekly
    description: '{{ doc("fct_ama_module_weekly") }}'
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns: [module_tag, week_start]
      - dbt_utils.expression_is_true:
          name: weekly_counts_are_consistent
          arguments:
            expression: "rated_events <= events and thumbs_up <= rated_events and grounded_events <= events and fresh_events <= events and slow_events <= fresh_events"
    columns:
      - name: module_tag
        data_tests: [not_null]
      - name: week_start
        data_tests: [not_null]
      - name: satisfaction_rate
        description: Thumbs up divided by rated answers. Read with feedback_coverage.
      - name: feedback_coverage
        description: Share of answers that received a usable rating.
      - name: grounded_rate
        description: Share of answers where RAG retrieved at least one source.
      - name: fast_rate
        description: Share of non-cached answers at or under slow_latency_ms.
      - name: quality_index
        description: AMA Quality Index, 0 to 100. NULL when any component is missing (for example a week with no ratings).
        data_tests:
          - dbt_utils.accepted_range:
              arguments: {min_value: 0, max_value: 100}
      - name: is_satisfaction_reliable
        description: True when the week has at least min_rated_for_signal rated answers.

# The AQI formula is tested with known inputs. Weights come from the aqi_weights var (0.50 / 0.25 / 0.25).
unit_tests:
  - name: aqi_is_computed_from_counts
    description: Four answers, two rated (one up), all grounded, two timed with one slow. Satisfaction 0.5, grounded 1.0, fast 0.5 gives 62.5.
    model: fct_ama_module_weekly
    given:
      - input: ref('int_ama_event_enriched')
        rows:
          - {module_tag: civile, week_start: 2026-04-06, has_feedback: true,  thumbs: 1,  is_zero_retrieval: false, fresh_latency_ms: 1000}
          - {module_tag: civile, week_start: 2026-04-06, has_feedback: true,  thumbs: -1, is_zero_retrieval: false, fresh_latency_ms: 9000}
          - {module_tag: civile, week_start: 2026-04-06, has_feedback: false, is_zero_retrieval: false, fresh_latency_ms: null}
          - {module_tag: civile, week_start: 2026-04-06, has_feedback: false, is_zero_retrieval: false, fresh_latency_ms: null}
    expect:
      rows:
        - {module_tag: civile, week_start: 2026-04-06, events: 4, rated_events: 2, thumbs_up: 1, grounded_events: 4, fresh_events: 2, slow_events: 1, quality_index: 62.5}

  - name: unrated_week_has_no_index
    description: A week with no ratings has no satisfaction rate, so the index is NULL rather than a score built on a fake 0% satisfaction.
    model: fct_ama_module_weekly
    given:
      - input: ref('int_ama_event_enriched')
        rows:
          - {module_tag: penale, week_start: 2026-04-06, has_feedback: false, is_zero_retrieval: false, fresh_latency_ms: 1000}
          - {module_tag: penale, week_start: 2026-04-06, has_feedback: false, is_zero_retrieval: false, fresh_latency_ms: 2000}
    expect:
      rows:
        - {module_tag: penale, week_start: 2026-04-06, events: 2, rated_events: 0, quality_index: null}
